name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ats_db
          POSTGRES_USER: ats_user
          POSTGRES_PASSWORD: ats_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build and Run Automated Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ats_db
          SPRING_DATASOURCE_USERNAME: ats_user
          SPRING_DATASOURCE_PASSWORD: ats_password
        run: mvn clean test
