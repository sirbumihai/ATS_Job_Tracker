spring:
  application:
    name: ats-job-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_db
    username: ats_user
    password: ats_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
