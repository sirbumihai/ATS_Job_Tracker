services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ats_postgres_db
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_backend_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_db
      SPRING_DATASOURCE_USERNAME: ats_user
      SPRING_DATASOURCE_PASSWORD: ats_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend_ui
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
