spring:
  application:
    name: ats-job-tracker

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:demo-dummy-key-for-local-dev}
      chat:
        options:
          model: gpt-3.5-turbo

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_db
    username: ats_user
    password: ats_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000 # 24 ore

server:
  port: 8080
